services:
  - type: web
    name: olake-ask
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: LLM_PROVIDER
        value: openai_compatible
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: LLM_FALLBACK_MODEL
        sync: false
      - key: LLM_FALLBACK_MODELS
        sync: false
      - key: LLM_REASONING_EFFORT
        value: none
      - key: REWRITE
        value: "off"
      - key: RERANK
        value: "off"
      - key: DAILY_TOKEN_BUDGET
        value: "5000000"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: VECTOR_BACKEND
        value: memory
      - key: EMBED_API
        value: auto
      - key: EMBED_API_KEY
        sync: false
